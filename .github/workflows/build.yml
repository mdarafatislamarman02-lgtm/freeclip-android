name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/workflows/api-dump.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Publish error log to branch ci-log (only if the build failed)
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILED|What went wrong" -A3 build.log | head -150 > /tmp/err.log || true
          tail -n 60 build.log >> /tmp/err.log
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout -q --orphan ci-log
          git rm -rf -q --cached . || true
          cp /tmp/err.log build-error.log
          git add -f build-error.log
          git commit -q -m "build error log"
          git push -f origin ci-log
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FreeClip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FreeClip-APK
          path: FreeClip.apk
      - name: Publish as a release (easy download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FreeClip latest build
          prerelease: true
          files: FreeClip.apk
