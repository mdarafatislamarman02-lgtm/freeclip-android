name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FreeClip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FreeClip-APK
          path: FreeClip.apk
      - name: Publish as a release (easy download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FreeClip latest build
          prerelease: true
          files: FreeClip.apk
